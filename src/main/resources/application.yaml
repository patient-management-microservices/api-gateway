server:
  port: ${SERVER_PORT:4005}

jwt:
  public-key-path: ${JWT_PUBLIC_KEY_PATH:/etc/jwt-keys/public.pem}
  issuer: ${JWT_ISSUER:auth-service}
  audience: ${JWT_AUDIENCE:patient-management}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # Auth routes WITHOUT JWT validation (login, register, refresh, logout)
            - id: auth-service-public-route
              uri: ${AUTH_SERVICE_URL:http://auth-service:4004}
              predicates:
                - Path=/api/auth/login, /api/auth/register, /api/auth/refresh, /api/auth/logout
              filters:
                - StripPrefix=2

            # Auth routes WITH JWT validation (everything else under /api/auth/**)
            - id: auth-service-protected-route
              uri: ${AUTH_SERVICE_URL:http://auth-service:4004}
              predicates:
                - Path=/api/auth/**
              filters:
                - StripPrefix=2
                - JwtValidation

            # Patient routes - read (any authenticated user)
            - id: patient-service-read-route
              uri: ${PATIENT_SERVICE_URL:http://patient-service:4000}
              predicates:
                - Path=/api/patients/**
                - Method=GET
              filters:
                - StripPrefix=1
                - JwtValidation

            # Patient routes - create and update (any authenticated user)
            - id: patient-service-write-route
              uri: ${PATIENT_SERVICE_URL:http://patient-service:4000}
              predicates:
                - Path=/api/patients/**
                - Method=POST,PUT
              filters:
                - StripPrefix=1
                - JwtValidation

            # Patient routes - delete (ADMIN only)
            - id: patient-service-admin-route
              uri: ${PATIENT_SERVICE_URL:http://patient-service:4000}
              predicates:
                - Path=/api/patients/**
                - Method=DELETE
              filters:
                - StripPrefix=1
                - name: JwtValidation
                  args:
                    requiredRole: ADMIN

            - id: api-docs-patient-route
              uri: ${PATIENT_SERVICE_URL:http://patient-service:4000}
              predicates:
                - Path=/api-docs/patients
              filters:
                - RewritePath=/api-docs/patients, /v3/api-docs

            - id: api-docs-auth-route
              uri: ${AUTH_SERVICE_URL:http://auth-service:4004}
              predicates:
                - Path=/api-docs/auth
              filters:
                - RewritePath=/api-docs/auth, /v3/api-docs

# ===== OBSERVABILITY =====
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://tempo:4318/v1/traces}

logging:
  pattern:
    correlation: "[${spring.application.name:},%mdc{traceId:-},%mdc{spanId:-}]"