server:
  port: ${SERVER_PORT:4005}

auth:
  service:
    url: ${AUTH_SERVICE_URL:http://auth-service:4004}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # Auth routes WITHOUT JWT validation (login, register)
            - id: auth-service-public-route
              uri: ${AUTH_SERVICE_URL:http://auth-service:4004}
              predicates:
                - Path=/api/auth/login, /api/auth/register
              filters:
                - StripPrefix=2

            # Auth routes WITH JWT validation (everything else)
            - id: auth-service-protected-route
              uri: ${AUTH_SERVICE_URL:http://auth-service:4004}
              predicates:
                - Path=/api/auth/**
              filters:
                - StripPrefix=2
                - JwtValidation

            - id: patient-service-route
              uri: ${PATIENT_SERVICE_URL:http://patient-service:4000}
              predicates:
                - Path=/api/patients/**
              filters:
                - StripPrefix=1
                - JwtValidation

            - id: api-docs-route
              uri: ${PATIENT_SERVICE_URL:http://patient-service:4000}
              predicates:
                - Path=/api-docs/patients
              filters:
                - RewritePath=/api-docs/patients, /v3/api-docs
                - JwtValidation